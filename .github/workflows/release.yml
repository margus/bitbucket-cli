name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Needed for sigstore/cosign keyless signing.
  id-token: write
  # Needed for pushing the Docker image to ghcr.io.
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # goreleaser needs full history for changelogs

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      # Tools goreleaser shells out to.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: docker login (ghcr)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with read+write on margus/homebrew-tap. Optional: if the
          # secret is absent, the goreleaser `brews:` step no-ops.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
